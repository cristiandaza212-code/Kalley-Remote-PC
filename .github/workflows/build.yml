name: Compilar Kalley Remote PC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Compilar EXE portable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KalleyRemotePC --collect-all androidtvremote2 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: KalleyRemotePC-Windows
          path: dist/KalleyRemotePC.exe
          if-no-files-found: error
