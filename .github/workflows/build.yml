name: Compilar Kalley Remote PC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Compilar EXE portable con icono
        shell: pwsh
        run: |
          if (-not (Test-Path "kalley.ico")) { throw "Falta kalley.ico: se cancela la compilacion para evitar perder el icono" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KalleyRemotePC --icon kalley.ico --add-data "kalley.ico;." --collect-all androidtvremote2 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: KalleyRemotePC-Windows
          path: dist/KalleyRemotePC.exe
          if-no-files-found: error
      - name: Preparar archivos de la version
        shell: pwsh
        run: |
          Compress-Archive -Path app.py,requirements.txt,README.md,kalley.ico -DestinationPath dist/KalleyRemotePC-CodigoFuente.zip -Force
      - name: Publicar version en GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag dist/KalleyRemotePC.exe dist/KalleyRemotePC-CodigoFuente.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Kalley Remote PC $tag" --notes "Windows 11: descarga KalleyRemotePC.exe. Incluye control RGB, botones redondeados, iconos compactos y conexion automatica. El ZIP contiene el codigo fuente."
